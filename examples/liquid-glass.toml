# Nested liquid-glass demo. See specs/rendering.md#liquid-glass for the contract.
# Run: target/debug/clear --config examples/liquid-glass.toml --command foot -o colors-dark.alpha=0.55 -o colors-dark.background=232834
# For a timed test, add --exit-after 120 before --command; it closes Clear after two minutes.
# Glass panels: dbus-run-session -- target/debug/clear --config examples/liquid-glass.toml --command quickshell -p examples/quickshell/liquid-glass.qml
gaps = 24

[[outputs]]
name = "virtual-1"
width = 1280
height = 720

[[workspaces]]
id = 1
name = "glass"
mode = "floating"

[wallpaper]
path = "liquid-glass-wallpaper.jpg"
mode = "fill"

[theme]
corner_radius = 24 # Fit the reference bezel to a window with a standard titlebar.
border_width = 1
active_border = [0.8, 0.9, 1.0, 0.35]
inactive_border = [0.6, 0.7, 0.8, 0.15]
blur_method = "kawase" # Or "kawase" with blur_radius = 2.
blur_radius = 1 # Light blur; use 0 for the unblurred reference.
blur_passes = 2

[theme.liquid_glass]
enabled = true
specular_opacity = 0.5
specular_saturation = 50
refraction_width = 10 # Widest rim; 3 is narrower, 1 is original, 0 disables refraction.
refraction_level = 1 # Up to 10 for stronger refraction; 1 is the reference default.
zoom_level = 1.5 # 0: no zoom; 1: reference default; 2: stronger zoom.

[theme.titlebar]
# Match the demo terminal's tint/opacity so backdrop features remain continuous
# across the titlebar/content boundary; client alpha is never overridden.
active_background = [0.1372549, 0.15686275, 0.20392157, 0.55]
inactive_background = [0.1372549, 0.15686275, 0.20392157, 0.55]

[keys]
leader = "Ctrl+Alt"

[[bindings]]
key = "leader+w"
action = "toggle_overview"

[[bindings]]
key = "Alt+Tab"
action = "alt_tab"

[[bindings]]
key = "leader+Return"
action = "spawn"
command = ["foot", "-o", "colors-dark.alpha=0.55", "-o", "colors-dark.background=232834"]

[[bindings]]
key = "leader+Shift+r"
action = "reload"

[[bindings]]
key = "leader+f"
action = "toggle_floating"

[[bindings]]
key = "leader+q"
action = "close_focused"

[[bindings]]
key = "leader+Escape"
action = "quit"
