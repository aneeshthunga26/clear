# Single-output nested session. Ctrl+Alt avoids most host Super shortcuts.
# This binding list replaces the defaults and exposes workspaces 1–3.
gaps = 12

# Explicitly replace the two default virtual outputs with one full-window output.
# Dimensions set the initial nested window size; the output follows host resizing.
[[outputs]]
name = "virtual-1"
width = 1280
height = 720

# Bundled procedural aurora wallpaper; no shell process required.
# Paths are relative to this config directory, or absolute (no ~/$VAR expansion).
[wallpaper]
path = "aurora.png"
mode = "fill" # fill, fit, stretch, center


[theme]
# Outer radii in logical pixels: all corners, [top, bottom], or [TL, TR, BR, BL].
corner_radius = 12
# Dual Kawase behind translucent windows/layers. Radius zero disables either method.
blur_method = "kawase" # Switch to "gaussian" for the original filter (try radius=12).
blur_radius = 4 # Sample offset per pyramid level, not Gaussian-equivalent pixels.
blur_passes = 3 # Downsample/upsample levels, 1..6.
border_width = 0

# Negotiated server-side titlebars; does not change client-side decorations.
[theme.titlebar]
# Straight RGBA, four finite channels in 0..1. Try background alpha 0.9 for translucency.
active_background = [0.137, 0.157, 0.204, 0.5]
inactive_background = [0.106, 0.118, 0.149, 1.0]
active_foreground = [0.937, 0.953, 0.980, 1.0]
inactive_foreground = [0.682, 0.718, 0.780, 1.0]
height = 32 # Integer logical pixels, 16..128; default 32; never rewrites saved geometry.
controls_side = "right" # Default; "left" mirrors close/maximize/minimize order.
show_icon = true # Default false; exact desktop ID lookup, otherwise a generic icon.
show_title = true # Default; false hides only text.
# Optional local SVGs relative to this config (or absolute), no ~/$VAR expansion.
# Create files before uncommenting; SVGs preserve their own colors/alpha.
# Omitted controls use built-ins; restore falls back to maximize SVG when omitted.
# Ctrl+Alt+Shift+R rereads resources atomically; failure keeps the last-good set.
# Startup resource failures warn and use built-in controls.
# [theme.titlebar.controls]
# minimize = "titlebar/minimize.svg"
# maximize = "titlebar/maximize.svg"
# restore = "titlebar/restore.svg"
# close = "titlebar/close.svg"

# Super+right drag resizes floating windows or supported internal tile boundaries.
# Master/stack: divider width and stack heights. Columns/rows/grid: adjacent sizes.
# Scrolling: individual widths. Spiral/monocle/script tiles do not resize.
# Floating exceptions remain resizable. Mouse gestures still use Super, not Ctrl+Alt.
[keys]
leader = "Ctrl+Alt"

[overview]
# Default: hover keeps the current preview; click a desktop to switch and close.
preview_workspace_on_hover = false

# Placement rules, not autostart or launcher/panel toggle commands.
# Arrays replace their defaults; [] disables a policy. IDs match exactly.
[shell]
# Center XDG launchers at their client-committed size, outside tiled layouts.
# Layer-shell launcher keyboard focus is being integrated separately.
launcher_app_ids = ["wofi"]

# Default override: only the layer, never the client's anchors or exclusive zone.
# Explicit rules require both fields; layers: background, bottom, top, overlay.
[[shell.panels]]
namespace = "waybar"
layer = "top"

# Float positions stay unbounded when panel reservations or output sizes change.
[[workspaces]]
id = 1
name = "main"
mode = "master_stack"

[[workspaces]]
id = 2
name = "floating"
mode = "floating"

[[workspaces]]
id = 3
name = "scrolling"
mode = "scrolling"

[[bindings]]
key = "leader+Return"
action = "spawn"
command = ["foot"]

[[bindings]]
key = "leader+w"
action = "toggle_overview"

[[bindings]]
key = "Alt+Tab"
action = "alt_tab"

[[bindings]]
key = "leader+Escape"
action = "quit"

[[bindings]]
key = "leader+q"
action = "close_focused"

[[bindings]]
key = "leader+1"
action = "switch_workspace"
workspace = 1

[[bindings]]
key = "leader+2"
action = "switch_workspace"
workspace = 2

[[bindings]]
key = "leader+3"
action = "switch_workspace"
workspace = 3

[[bindings]]
key = "leader+Shift+1"
action = "move_to_workspace"
workspace = 1

[[bindings]]
key = "leader+Shift+2"
action = "move_to_workspace"
workspace = 2

[[bindings]]
key = "leader+Shift+3"
action = "move_to_workspace"
workspace = 3


[[bindings]]
key = "leader+m"
action = "cycle_mode"

[[bindings]]
key = "leader+BackSpace"
action = "clear_output_mode"

[[bindings]]
key = "leader+t"
action = "set_workspace_mode"
mode = "master_stack"

[[bindings]]
key = "leader+g"
action = "set_workspace_mode"
mode = "floating"

[[bindings]]
key = "leader+h"
action = "set_workspace_mode"
mode = "scrolling"

[[bindings]]
key = "leader+f"
action = "toggle_floating"

# Maximize respects panel reservations; Alt+Tab or a dock click restores minimized windows.
[[bindings]]
key = "leader+Up"
action = "toggle_maximized"

[[bindings]]
key = "leader+Down"
action = "minimize"

[[bindings]]
key = "leader+j"
action = "focus_next"

[[bindings]]
key = "leader+k"
action = "focus_previous"

[[bindings]]
key = "leader+Left"
action = "scroll"
amount = -300

[[bindings]]
key = "leader+Right"
action = "scroll"
amount = 300

[[bindings]]
key = "leader+Shift+r"
action = "reload"

# Enable compositor presentation effects; see specs/animations.md for controls.
[animations]
enabled = true
frame_rate = "refresh-rate"
speed = 1.0

[[bindings]]
key = "Ctrl+Alt+Shift+f"
action = "toggle_fullscreen"
